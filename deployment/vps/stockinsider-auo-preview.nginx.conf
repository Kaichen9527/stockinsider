# AUO research preview is isolated from the formal StockInsider release.
location ^~ /preview/auo-2409-assets/_next/static/ {
    alias /opt/stockinsider-previews/auo-2409-app/current/.next/static/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ^~ /preview/auo-2409 {
    proxy_pass http://127.0.0.1:3102;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
