# Supabase SDK compatibility boundary for StockInsider's private PostgREST.
# This server is deliberately unavailable on every public interface.
server {
    listen 127.0.0.1:3302;
    server_name _;

    access_log off;

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3301/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3301;
        proxy_set_header Connection "";
        proxy_pass_request_headers on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /rest/v1 {
        return 404;
    }

    location / {
        return 404;
    }
}
