# Supabase SDK compatibility boundary for StockInsider's private PostgREST.
# This server is deliberately unavailable on every public interface.
server {
    listen 127.0.0.1:3302;
    server_name _;

    # Legacy Supabase query builders can encode several hundred UUID filters in
    # the request target. This endpoint is loopback-only; accept those bounded
    # internal reads while producers are migrated to paged/chunked queries.
    large_client_header_buffers 4 32k;

    access_log off;

    location /rest/v1/ {
        proxy_pass http://127.0.0.1:3301/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3301;
        proxy_set_header Connection "";
        proxy_pass_request_headers on;
        # PostgREST reflects filters in Content-Location. The compatibility
        # queries above can therefore produce a response header larger than
        # nginx's default single-page proxy header buffer. Keep this bounded
        # allowance on the loopback-only server until all callers are paged.
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /rest/v1 {
        return 404;
    }

    location / {
        return 404;
    }
}
