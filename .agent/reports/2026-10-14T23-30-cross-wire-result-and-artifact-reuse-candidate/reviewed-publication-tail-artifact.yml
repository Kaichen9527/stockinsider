name: Reviewed publication source Linux artifact

on:
  pull_request:
    paths:
      - '.github/workflows/reviewed-publication-tail-artifact.yml'
      - 'docs/operations/2026-10-14/reviewed-publication-artifact-handoff.md'
  workflow_dispatch:

# Verify the fixed existing reviewed package. No production DB access or deployment.
permissions:
  contents: read
  actions: read
concurrency:
  group: reviewed-linux-dd59817f750684b093965f539dd4de466be13077
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REVIEWED_SOURCE: dd59817f750684b093965f539dd4de466be13077
      REVIEW_EVIDENCE: c2b146adb6d03814f2bd9a7af72baf003bb48812
      REVIEWED_TREE: 6a9a08af70fb94b50ed2b5eee6aaf3686f648b99
      REVIEWED_WEB_TREE: c516655efaac8260b1bcf5938f8f4d65ab61ad44
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - name: Retrieve the actual builder subject for fresh canonical tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the existing pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Provision original isolated PostgreSQL fixtures before canonical tests
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/pgdg.asc"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$key"
          fingerprint=$(gpg --batch --show-keys --with-colons "$key" | awk -F: '$1=="fpr" {print $10; exit}')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo install -m 0644 "$key" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Architectures: amd64' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17 postgresql-client-17
          bin=/usr/lib/postgresql/17/bin
          for tool in pg_config initdb pg_ctl psql; do test -x "$bin/$tool"; done
          "$bin/pg_config" --version | grep -E '^PostgreSQL 17\.'
          echo "$bin" >> "$GITHUB_PATH"
          echo "USER=$(id -un)" >> "$GITHUB_ENV"
      - name: Install the actual builder's exact locked dependencies
        run: |
          npm ci
          npm --prefix web ci
      - name: Provision the builder's locked browser before its canonical consumers
        working-directory: web
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run fresh canonical correctness on the actual builder subject
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.14.0
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -m 0700 "$RUNNER_TEMP/standalone-export"
          npm run test:source-led-opportunity-v3:product-correctness 2>&1 | tee "$RUNNER_TEMP/standalone-export/builder-canonical.log"
          git diff --exit-code
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const dir = process.env.RUNNER_TEMP + '/standalone-export';
          const log = fs.readFileSync(dir + '/builder-canonical.log', 'utf8');
          assert.ok(Buffer.byteLength(log, 'utf8') <= 4 * 1024 * 1024);
          const start = log.indexOf('TAP version 13\n');
          assert.ok(start >= 0);
          const tap = log.slice(start);
          assert.equal([...tap.matchAll(/^TAP version 13$/gmu)].length, 1);
          assert.doesNotMatch(tap, /^\s*(?:not ok\b|Bail out!)/mu);
          const plans = [...tap.matchAll(/^1\.\.(\d+)$/gmu)];
          assert.equal(plans.length, 1);
          assert.equal(plans[0][1], '155');
          const resultLines = [...tap.matchAll(/^(?:not )?ok\b.*$/gmu)].map(m => m[0]);
          assert.equal(resultLines.length, 155);
          for (const [index, line] of resultLines.entries()) {
            const result = /^ok (\d+) - (.+)$/u.exec(line);
            assert.ok(result);
            assert.equal(result[1], String(index + 1));
            assert.doesNotMatch(result[2], /\s+#\s*(?:SKIP|TODO)\b/iu);
          }
          for (const [name, expected] of Object.entries({ tests: 155, pass: 155, fail: 0, cancelled: 0, skipped: 0, todo: 0 })) {
            const rows = [...tap.matchAll(new RegExp('^# ' + name + ' (\\d+)$', 'gmu'))];
            assert.equal(rows.length, 1);
            assert.equal(Number(rows[0][1]), expected);
          }
          const pcr = [...tap.matchAll(/^ok \d+ - acceptance (PCR-\d{3})$/gmu)].map(m => m[1]);
          assert.deepEqual(pcr, Array.from({ length: 31 }, (_, i) => 'PCR-' + String(i + 1).padStart(3, '0')));
          const git = ref => execFileSync('git', ['rev-parse', ref], { encoding: 'utf8' }).trim();
          assert.equal(git('HEAD'), process.env.GITHUB_SHA);
          assert.match(process.env.GITHUB_WORKFLOW_SHA ?? '', /^[a-f0-9]{40}$/u);
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          fs.writeFileSync(dir + '/builder-canonical.tap', tap, { flag: 'wx' });
          fs.writeFileSync(dir + '/builder-correctness.json', JSON.stringify({
            executionSubject: git('HEAD'), executionTree: git('HEAD^{tree}'), executionWebTree: git('HEAD:web'),
            builderWorkflowSha: process.env.GITHUB_WORKFLOW_SHA, workflowRef: process.env.GITHUB_WORKFLOW_REF,
            triggerCommit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            command: 'npm run test:source-led-opportunity-v3:product-correctness',
            canonicalTests: 155, pass: 155, fail: 0, cancelled: 0, skipped: 0, todo: 0,
            namedPCR: pcr, canonicalSectionSha256: hash(tap),
            rootLockSha256: hash(fs.readFileSync('package-lock.json')),
            webLockSha256: hash(fs.readFileSync('web/package-lock.json')),
            artifactApplicationSubject: process.env.REVIEWED_SOURCE,
            artifactApplicationTestsAttributedToBuilder: false,
          }, null, 2) + '\n', { flag: 'wx' });
          NODE
      - name: Retrieve genuine direct-child evidence and source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c2b146adb6d03814f2bd9a7af72baf003bb48812
          fetch-depth: 0
          persist-credentials: false
      - name: Select the reviewed source, without copying evidence into it
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P "$REVIEW_EVIDENCE")" = "$REVIEWED_SOURCE"
          git checkout --detach "$REVIEWED_SOURCE"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE"
          test "$(git rev-parse HEAD^{tree})" = "$REVIEWED_TREE"
          test "$(git rev-parse HEAD:web)" = "$REVIEWED_WEB_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify original review binding and record distinct builder identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.14.0
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          const { resolveReviewedRuntimeRelease } = createRequire(import.meta.url)('./scripts/runtime/reviewed-runtime-release.js');
          const release = resolveReviewedRuntimeRelease({ repositoryRoot: process.cwd(), sourceCommit: process.env.REVIEWED_SOURCE, attestationCommit: process.env.REVIEW_EVIDENCE });
          assert.equal(release.commitSha, process.env.REVIEWED_SOURCE);
          assert.equal(release.treeSha, process.env.REVIEWED_TREE);
          assert.match(process.env.GITHUB_WORKFLOW_SHA ?? '', /^[a-f0-9]{40}$/u);
          assert.match(process.env.GITHUB_SHA ?? '', /^[a-f0-9]{40}$/u);
          fs.writeFileSync(process.env.RUNNER_TEMP + '/standalone-export/reuse-review-binding.json', JSON.stringify({
            sourceCommit: release.commitSha, sourceTree: release.treeSha,
            directChildEvidence: process.env.REVIEW_EVIDENCE, reviewAttestationSha256: release.reviewAttestationSha256,
            builderWorkflowSha: process.env.GITHUB_WORKFLOW_SHA, triggerCommit: process.env.GITHUB_SHA,
            builderCorrectnessReceipt: 'builder-correctness.json',
            reusedArtifactId: 11904225538, applicationBuildRunId: '38580440366',
            upstreamReviewBinding: 'upstream/review-binding.json',
            workflowRef: process.env.GITHUB_WORKFLOW_REF, runId: process.env.GITHUB_RUN_ID,
            databaseConnectionAttempted: false, deploymentPerformed: false,
          }, null, 2) + '\n', { flag: 'wx' });
          NODE
      - name: Retrieve only the fixed successful existing artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Kaichen9527/stockinsider/actions/runs/38580440366 > "$RUNNER_TEMP/standalone-export/upstream-run.json"
          gh api repos/Kaichen9527/stockinsider/actions/artifacts/11904225538 > "$RUNNER_TEMP/standalone-export/upstream-artifact-metadata.json"
          gh api repos/Kaichen9527/stockinsider/actions/artifacts/11904225538/zip > "$RUNNER_TEMP/reviewed-existing-artifact.zip"
      - name: Verify fixed provenance and safely extract the unchanged existing package
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PYTHON'
          import hashlib, json, os, re, stat, tarfile, zipfile
          from pathlib import Path, PurePosixPath

          # Fixed successful upstream input; no caller-selected run/artifact or build fallback.
          tmp = Path(os.environ['RUNNER_TEMP'])
          export = tmp / 'standalone-export'
          source = 'dd59817f750684b093965f539dd4de466be13077'
          zip_hash = 'c3006c864a95d8cebb022d32d848baccec7ba99cfe95b9a1a6f446e7e002caed'
          tar_hash = '398e71768ea0e7a5935282432c0edfcb2f47c953712b715562def95c3745add4'
          manifest_hash = '344489589e929158a73d658c968128a563dd53ed9a5eac6b37ee89553b9a0a4a'
          upstream = export / 'upstream'
          metadata = json.loads((export / 'upstream-artifact-metadata.json').read_text())
          run = json.loads((export / 'upstream-run.json').read_text())
          assert metadata['id'] == 11904225538
          assert metadata['name'] == 'reviewed-linux-standalone-' + source + '-38580440366-success'
          assert metadata['size_in_bytes'] == 28254621 and metadata['expired'] is False
          assert metadata['digest'] == 'sha256:' + zip_hash
          assert metadata['workflow_run']['id'] == 38580440366
          assert metadata['workflow_run']['repository_id'] == 1169909279
          assert metadata['workflow_run']['head_repository_id'] == 1169909279
          assert metadata['workflow_run']['head_sha'] == 'e902021ee9df537d4a8da2a2eaff3921084d44d7'
          assert run['id'] == 38580440366 and run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['repository']['id'] == 1169909279
          assert run['head_sha'] == 'e902021ee9df537d4a8da2a2eaff3921084d44d7'
          archive = tmp / 'reviewed-existing-artifact.zip'
          assert archive.stat().st_size == 28254621
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == zip_hash
          expected = {'SHA256SUMS', 'builder-canonical.log', 'builder-canonical.tap',
                      'builder-correctness.json', 'package.json', 'packaged-boot.json',
                      'packaged-boot.stderr', 'packaged-boot.stdout', 'release-manifest.json',
                      'review-binding.json', 'source-identity.txt', 'stockinsider-linux.tar.gz', 'verification.json'}
          upstream.mkdir(mode=0o700)
          with zipfile.ZipFile(archive) as z:
              entries = z.infolist()
              assert len(entries) == 13 and {e.filename for e in entries} == expected
              assert sum(e.file_size for e in entries) < 64 * 1024 * 1024
              for e in entries:
                  assert not e.is_dir() and not (e.flag_bits & 1)
                  assert stat.S_IFMT(e.external_attr >> 16) in (0, stat.S_IFREG)
                  with (upstream / e.filename).open('xb') as out:
                      out.write(z.read(e))  # zipfile verifies CRC; whole ZIP is hash-bound above.
          checks = (upstream / 'SHA256SUMS').read_text().splitlines()
          assert len(checks) == 12
          seen = set()
          for row in checks:
              m = re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9_.-]+)', row)
              assert m and m[2] in expected - {'SHA256SUMS'} and m[2] not in seen
              seen.add(m[2])
              assert hashlib.sha256((upstream / m[2]).read_bytes()).hexdigest() == m[1]
          assert seen == expected - {'SHA256SUMS'}
          assert hashlib.sha256((upstream / 'stockinsider-linux.tar.gz').read_bytes()).hexdigest() == tar_hash
          assert hashlib.sha256((upstream / 'release-manifest.json').read_bytes()).hexdigest() == '127d7d9427c0122c547021b9a9a01e4b1d3ce960087a0cef1796e1b88e0ae943'
          receipt = json.loads((upstream / 'release-manifest.json').read_text())
          manifest = receipt['manifest']
          assert receipt['manifestSha256'] == manifest_hash
          assert manifest['sourceCommit'] == manifest['packagerCommit'] == manifest['releaseId'] == source
          assert manifest['fileCount'] == 2586 and manifest['bytes'] == 79354761
          assert manifest['entrypoint'] == 'app/server.js'
          binding = json.loads((upstream / 'review-binding.json').read_text())
          assert binding['sourceCommit'] == source and binding['sourceTree'] == '6a9a08af70fb94b50ed2b5eee6aaf3686f648b99'
          assert binding['directChildEvidence'] == 'c2b146adb6d03814f2bd9a7af72baf003bb48812'
          assert binding['reviewAttestationSha256'] == 'e0fed54595dda6ad3be4dfe8a9f4714b9912c754b13842ea28bdff99b9f8ebd3'
          assert binding['builderWorkflowSha'] == binding['triggerCommit'] == 'c3995978bf9bb5dff5913fc709d9d30f674e55f2'
          assert binding['runId'] == '38580440366'
          assert binding['databaseConnectionAttempted'] is False and binding['deploymentPerformed'] is False
          assert (upstream / 'source-identity.txt').read_text().splitlines() == [source, '6a9a08af70fb94b50ed2b5eee6aaf3686f648b99', 'c516655efaac8260b1bcf5938f8f4d65ab61ad44']
          release_parent = tmp / 'reviewed-standalone'
          release_parent.mkdir(mode=0o700)
          with tarfile.open(upstream / 'stockinsider-linux.tar.gz', 'r:gz') as t:
              members = t.getmembers()
              assert len(members) == 3101
              regular = [m for m in members if m.isfile()]
              assert len(regular) == 2587 and sum(m.size for m in regular) == 79955758
              paths = set()
              for m in members:
                  name = m.name.rstrip('/')
                  parts = PurePosixPath(name).parts
                  assert name and not name.startswith('/') and '\\' not in name
                  assert parts[0] == source and all(p not in ('', '.', '..') for p in name.split('/'))
                  assert name not in paths and (m.isdir() or m.isfile())
                  assert not (m.mode & 0o7000)
                  paths.add(name)
              for m in members:
                  destination = release_parent / m.name
                  if m.isdir():
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with destination.open('xb') as out, t.extractfile(m) as src:
                          for block in iter(lambda: src.read(1024 * 1024), b''): out.write(block)
                      destination.chmod(m.mode & 0o777)
          assert (release_parent / source / 'release-manifest.json').read_bytes() == (upstream / 'release-manifest.json').read_bytes()
          proof = {'artifactId': 11904225538, 'upstreamRunId': 38580440366,
                   'zipSha256': zip_hash, 'tarSha256': tar_hash, 'manifestSha256': manifest_hash,
                   'sourceCommit': source, 'directChildEvidence': binding['directChildEvidence'],
                   'upstreamBuilderSubject': binding['builderWorkflowSha'],
                   'currentBuilderSubject': os.environ['GITHUB_SHA'], 'currentRunId': os.environ['GITHUB_RUN_ID'],
                   'upstreamTestsAttributedToCurrentBuilder': False, 'applicationRebuilt': False,
                   'safeTarMembers': len(members), 'fullOriginalVerifierReceipt': 'reuse-full-verification.json',
                   'productionReadinessProven': False, 'deploymentPerformed': False}
          (export / 'reuse-provenance.json').write_text(json.dumps(proof, indent=2) + '\n')
          PYTHON
          test "$(sha256sum scripts/verify-standalone-release.mjs | cut -d' ' -f1)" = 1e4bb10d2ee694eefd0493653a71d54b8d94deade74fa66a86b579b25ebe930b
          node scripts/verify-standalone-release.mjs "$RUNNER_TEMP/reviewed-standalone/$REVIEWED_SOURCE" > "$RUNNER_TEMP/standalone-export/reuse-full-verification.json"
      - name: Boot the packaged production entrypoint without credentials
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { spawn } from 'node:child_process';
          import { setTimeout as pause } from 'node:timers/promises';
          const exportDir = path.join(process.env.RUNNER_TEMP, 'standalone-export');
          const root = path.join(process.env.RUNNER_TEMP, 'reviewed-standalone', process.env.REVIEWED_SOURCE);
          const { manifest } = JSON.parse(fs.readFileSync(path.join(root, 'release-manifest.json'), 'utf8'));
          assert.equal(manifest.sourceCommit, process.env.REVIEWED_SOURCE);
          const entry = path.resolve(root, manifest.entrypoint);
          assert.ok(entry.startsWith(root + path.sep));
          const asset = manifest.files.find(f => /\/\.next\/static\/.+\.(?:js|css)$/u.test(f.path));
          assert.ok(asset);
          const assetUrl = '/_next/static/' + asset.path.split('/.next/static/')[1];
          const child = spawn(process.execPath, [entry], { cwd: path.dirname(entry), env: {
            PATH: process.env.PATH, HOME: process.env.HOME, LANG: 'C.UTF-8', TZ: 'UTC',
            NODE_ENV: 'production', HOSTNAME: '127.0.0.1', PORT: '3114', NEXT_TELEMETRY_DISABLED: '1',
          }, stdio: ['ignore', 'pipe', 'pipe'] });
          child.stdout.pipe(fs.createWriteStream(path.join(exportDir, 'packaged-boot.stdout')));
          child.stderr.pipe(fs.createWriteStream(path.join(exportDir, 'packaged-boot.stderr')));
          let closed = false, stopping = false, unexpectedExit = false;
          const ended = new Promise((resolve, reject) => {
            child.once('error', reject);
            child.once('close', (code, signal) => { closed = true; unexpectedExit = !stopping; resolve({ code, signal }); });
          });
          // Observe asynchronous spawn failure while startup requests are pending.
          void ended.catch(() => {});
          const get = route => fetch('http://127.0.0.1:3114' + route, { signal: AbortSignal.timeout(3000), redirect: 'error' });
          let proof;
          try {
            const until = Date.now() + 30000;
            let auth;
            while (!auth) {
              assert.equal(closed, false, 'packaged process exited before probe');
              try { auth = await get('/api/internal/health-check'); }
              catch (error) { if (Date.now() >= until) throw error; await pause(100); }
            }
            assert.equal(auth.status, 500);
            assert.deepEqual(await auth.json(), { ok: false, error: 'INTERNAL_API_KEY/CRON_SECRET not configured' });
            assert.equal((await get('/trade-plan-fixture')).status, 404);
            const staticResponse = await get(assetUrl);
            assert.equal(staticResponse.status, 200);
            assert.ok(staticResponse.body);
            const digest = createHash('sha256'); let staticBytes = 0;
            for await (const chunk of staticResponse.body) {
              staticBytes += chunk.byteLength; assert.ok(staticBytes <= asset.bytes);
              digest.update(chunk);
            }
            assert.equal(staticBytes, asset.bytes);
            const staticHash = digest.digest('hex');
            assert.equal(staticHash, asset.sha256);
            assert.equal(closed, false);
            assert.equal(child.exitCode, null);
            assert.equal(child.signalCode, null);
            proof = { sourceCommit: process.env.REVIEWED_SOURCE, nodeVersion: process.versions.node,
              reusedArtifactId: 11904225538, applicationBuildRunId: '38580440366',
              productionEntrypoint: manifest.entrypoint, credentialEnvironment: 'absent',
              unconfiguredAuthStatus: 500, fixtureUnavailableStatus: 404,
              assetPath: asset.path, assetSha256: staticHash, databaseOrApiMutationPerformed: false,
              productionReadinessProven: false, privatePeerOrLiveDataProven: false };
          } finally {
            stopping = true;
            if (!closed) child.kill('SIGTERM');
            if (!closed) await Promise.race([ended, pause(5000)]);
            if (!closed) child.kill('SIGKILL');
            const exit = await Promise.race([ended, pause(5000).then(() => { throw Error('packaged_process_cleanup_unconfirmed'); })]);
            assert.equal(unexpectedExit, false);
            if (proof) { proof.confirmedProcessExit = exit; fs.writeFileSync(path.join(exportDir, 'packaged-boot.json'), JSON.stringify(proof, null, 2) + '\n', { flag: 'wx' }); }
          }
          NODE
      - name: Seal new verification receipts without rebuilding or repacking
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/standalone-export"
          (cd "$export_dir" && find . -type f ! -path ./SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          test "$(sha256sum "$export_dir/upstream/stockinsider-linux.tar.gz" | cut -d' ' -f1)" = 398e71768ea0e7a5935282432c0edfcb2f47c953712b715562def95c3745add4
      - name: Retain new verification and unchanged upstream package separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-reuse-dd59817f750684b093965f539dd4de466be13077-${{ github.run_id }}-${{ job.status }}
          path: ${{ runner.temp }}/standalone-export/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
