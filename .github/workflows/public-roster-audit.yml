name: Read-only public roster audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/public-roster-audit.yml'
      - 'scripts/public_roster_observer.py'
      - 'scripts/test_public_roster_observer.py'
      - 'scripts/public-roster-request.json'

permissions:
  contents: read

jobs:
  public-observation:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/tw-strategy-lab-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test read-only boundaries
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/public-roster-audit"
          python -m unittest discover -s scripts -p test_public_roster_observer.py -v 2>&1 | tee "$RUNNER_TEMP/public-roster-audit/tests.log"
      - name: Admit only an explicit unexpired request changed in this head commit
        id: request
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os, pathlib, subprocess
          path = 'scripts/public-roster-request.json'
          request = json.loads(pathlib.Path(path).read_text())
          assert set(request) == {'schema', 'request_id', 'expires_at', 'scope'}
          assert request['schema'] == 'stockinsider-public-audit-request-v1'
          assert request['scope'] == 'public_daily_stages_only'
          expiry = datetime.fromisoformat(request['expires_at'].replace('Z', '+00:00'))
          assert expiry.tzinfo is not None
          changed = subprocess.check_output(['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD'], text=True).splitlines()
          execute = path in changed and datetime.now(timezone.utc) < expiry
          record = dict(request, source_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                        execute_public_get=execute, production_write=False, research_trial=False,
                        independent_review=False, note='No ordinary code/doc push repeats the public GET audit.')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'public-roster-audit'
          (out / 'request.json').write_text(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('execute=' + str(execute).lower() + '\n')
          PY
      - name: Observe bounded public daily stages without authentication
        if: steps.request.outputs.execute == 'true'
        timeout-minutes: 3
        run: python scripts/public_roster_observer.py --output "$RUNNER_TEMP/public-roster-audit/observation.json"
      - name: Retain tests, request identity and source success or blockers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-roster-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-roster-audit/
          retention-days: 7
          if-no-files-found: error
