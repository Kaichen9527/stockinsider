name: Night-Shift Research Runtime

on:
  schedule:
    # Asia/Taipei 19:00 daily. Public sources receive their final pre-run refresh at 18:30.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to DB)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency:
  group: stockinsider-production-data-writes
  cancel-in-progress: false

jobs:
  research-pipeline:
    name: Market, research and classification pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_URL: ${{ secrets.APP_URL }}
      EXPECTED_APP_URL: https://stockinsider-three.vercel.app
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Market prices, chips and revenue pipeline
        run: node scripts/call_internal_api.mjs /api/internal/pipeline-run "{\"dryRun\":$DRY_RUN,\"mode\":\"core\",\"syncTimeoutMs\":800000}" | tee /tmp/pipeline-run.json
      - name: MOPS material filings
        run: node scripts/call_internal_api.mjs /api/internal/mops-filing-ingest "{\"dryRun\":$DRY_RUN}" | tee /tmp/mops-filing-ingest.json
      - name: Earnings calls
        run: node scripts/call_internal_api.mjs /api/internal/earnings-call-ingest "{\"dryRun\":$DRY_RUN}" | tee /tmp/earnings-call-ingest.json
      - name: Dynamic source mentions
        run: node scripts/call_internal_api.mjs /api/internal/dynamic-mention-scan "{\"dryRun\":$DRY_RUN}" | tee /tmp/dynamic-mention-scan.json
      - name: Source quality and KOL discovery
        run: node scripts/call_internal_api.mjs /api/internal/source-discovery "{\"dryRun\":$DRY_RUN}" | tee /tmp/source-discovery.json
      - name: Authorized podcast RSS metadata
        run: node scripts/call_internal_api.mjs /api/internal/podcast-sync "{\"dryRun\":$DRY_RUN}" | tee /tmp/podcast-sync.json
      - name: Thesis refresh
        run: node scripts/call_internal_api.mjs /api/internal/thesis-refresh "{\"dryRun\":$DRY_RUN}" | tee /tmp/thesis-refresh.json
      - name: Research report build
        run: node scripts/call_internal_api.mjs /api/internal/research-report-build "{\"dryRun\":$DRY_RUN}" | tee /tmp/research-report-build.json
      - name: Publish classification snapshot
        run: node scripts/call_internal_api.mjs /api/internal/pipeline-dispatch-run "{\"dryRun\":$DRY_RUN}" | tee /tmp/pipeline-dispatch-run.json
      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: night-shift-logs-${{ github.run_id }}
          path: /tmp/*.json
          retention-days: 14
