          print('::notice title=Trading-invalidity cleanup receipt::'+json.dumps({'pgRunning':state['Running'],'pgPid':state['Pid'],'pgExit':state['ExitCode'],'shutdownLogObserved':True,'socketAbsence':socket_absence,'resourceReceiptObserved':resource.exists(),'ownedProcessCounts':counts,'fullPrivateCleanupSha256':hashlib.sha256(pathlib.Path('/tmp/stockinsider-vnext-ci/trading-invalidity-cleanup.private.json').read_bytes()).hexdigest(),'dataRetained':True},separators=(',',':')))
