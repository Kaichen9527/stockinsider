name: StockInsider vNext isolated quality
on:
  pull_request:
    paths:
      - '.github/workflows/stockinsider-vnext-quality.yml'
      - 'web/**'
      - 'scripts/vnext-*'
      - 'scripts/opportunity-v3/**'
      - 'scripts/assert_canonical_vercel_project.mjs'
      - 'deployment/vps/bootstrap-stockinsider-postgres.sql'
      - '.nvmrc'
      - 'scripts/candidate-financial-document-write-lease-route.test.mjs'
      - 'migrations/20261022_*'
      - 'openspec/changes/stockinsider-vnext-20/**'
      - 'specs/research-admission/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  vnext-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Workspace and temporary filesystem admission
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              free=s.f_bavail*s.f_frsize
              print(p,free)
              if free<8589934592: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
      - name: Install unchanged locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix web ci --ignore-scripts
          node web/scripts/sync-official-authority.mjs
      - name: Actual source contracts, types and lint
        run: |
          mkdir -m 700 /tmp/stockinsider-vnext-ci
          node --experimental-strip-types web/src/lib/vnext/vnext.test.ts | tee /tmp/stockinsider-vnext-ci/pure.tap
          node --experimental-strip-types web/src/lib/vnext/discovery.test.ts | tee /tmp/stockinsider-vnext-ci/discovery.tap
          node --experimental-strip-types web/src/lib/vnext/boundaries.test.ts | tee /tmp/stockinsider-vnext-ci/boundaries.tap
          node --experimental-strip-types web/src/lib/vnext/worker.test.ts | tee /tmp/stockinsider-vnext-ci/worker-source.tap
          node --experimental-strip-types web/src/lib/vnext/analysis-sources.test.ts | tee /tmp/stockinsider-vnext-ci/analysis-source.tap
          node --experimental-strip-types web/src/lib/vnext/twse-snapshot.test.ts | tee /tmp/stockinsider-vnext-ci/twse-snapshot-source.tap
          node --experimental-strip-types web/src/lib/vnext/thesis.test.ts | tee /tmp/stockinsider-vnext-ci/thesis-source.tap
          node --experimental-strip-types web/src/lib/vnext/thesis-semantic-authority.test.ts | tee /tmp/stockinsider-vnext-ci/thesis-semantic-authority-source.tap
          node --experimental-strip-types web/src/lib/vnext/semantic-score-fence.test.ts | tee /tmp/stockinsider-vnext-ci/semantic-score-fence-source.tap
          node --experimental-strip-types web/src/lib/vnext/catalyst-criteria.test.ts | tee /tmp/stockinsider-vnext-ci/catalyst-criteria-source.tap
          node --experimental-strip-types web/src/lib/vnext/forecast-evidence.test.ts | tee /tmp/stockinsider-vnext-ci/forecast-evidence-source.tap
          node --experimental-strip-types web/src/lib/vnext/dimensionless-arithmetic.test.ts | tee /tmp/stockinsider-vnext-ci/dimensionless-source.tap
          node --experimental-strip-types web/src/lib/vnext/reviewed-target.test.ts | tee /tmp/stockinsider-vnext-ci/reviewed-target-source.tap
          node --experimental-strip-types web/src/lib/vnext/cached-admission.test.ts | tee /tmp/stockinsider-vnext-ci/cached-source.tap
          node --experimental-strip-types web/src/lib/vnext/source-withdrawal.test.ts | tee /tmp/stockinsider-vnext-ci/withdrawal-source.tap
          node --experimental-strip-types web/src/lib/vnext/artifact-financial-summary.test.ts | tee /tmp/stockinsider-vnext-ci/financial-summary-source.tap
          node --experimental-strip-types web/src/lib/vnext/preparation-authority.test.ts | tee /tmp/stockinsider-vnext-ci/preparation-authority-source.tap
          node --experimental-strip-types web/src/lib/vnext/preparation-reconciliation.test.ts | tee /tmp/stockinsider-vnext-ci/preparation-reconciliation-source.tap
          node --experimental-strip-types web/src/lib/vnext/research-failure.test.ts | tee /tmp/stockinsider-vnext-ci/research-failure-source.tap
          node --experimental-strip-types scripts/vnext-business-vectors.test.mjs | tee /tmp/stockinsider-vnext-ci/business-vectors.tap
          node scripts/candidate-financial-document-write-lease-route.test.mjs | tee /tmp/stockinsider-vnext-ci/lease-routes.tap
          npm --prefix web run typecheck
          npm --prefix web run lint
      - name: Full ordinary build
        run: npm --prefix web run build
      - name: Isolated PostgreSQL real concurrency and synthetic publication lifecycle
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-ci
        run: |
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -U postgres -d vnext; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if VNEXT_NATIVE_ARTIFACTS=/tmp/stockinsider-vnext-ci/admission node --experimental-strip-types scripts/vnext-admission-postgres.test.mjs > /tmp/stockinsider-vnext-ci/admission.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/admission.tap.private.log /tmp/stockinsider-vnext-ci/admission.tap
          test "$test_status" = 0
          if VNEXT_BUSINESS_DATABASE=vnext_business_01 VNEXT_NATIVE_ARTIFACTS=/tmp/stockinsider-vnext-ci/business node --experimental-strip-types scripts/vnext-business-postgres.test.mjs > /tmp/stockinsider-vnext-ci/business.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/business.tap.private.log /tmp/stockinsider-vnext-ci/business.tap
          test "$test_status" = 0
      - name: Genuine captured-prefix legacy coexistence and concurrent mode fence
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-legacy-full-04
          VNEXT_LEGACY_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/legacy-full-pg-socket-04
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/legacy
        run: |
          mkdir -m 700 /tmp/stockinsider-vnext-oct22-private
          mkdir -m 700 "$VNEXT_LEGACY_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_LEGACY_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_legacy -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_LEGACY_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -U postgres -d vnext_legacy; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-legacy-fence-postgres.test.mjs > /tmp/stockinsider-vnext-ci/legacy.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/legacy.tap.private.log /tmp/stockinsider-vnext-ci/legacy.tap
          test "$test_status" = 0
      - name: Actual durable worker journal with explicitly synthetic provider
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-01
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-01
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/worker
        run: |
