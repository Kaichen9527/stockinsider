          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -U postgres -d vnext_worker; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-worker-postgres.test.mjs > /tmp/stockinsider-vnext-ci/worker.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/worker.tap.private.log /tmp/stockinsider-vnext-ci/worker.tap
          test "$test_status" = 0
      - name: Real permitted-source budgets and frozen market journal (synthetic originals/model)
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-02
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-02
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/analysis
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              if s.f_bavail*s.f_frsize<8589934592: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_worker -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_WORKER_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -U postgres -d vnext_worker; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-analysis-postgres.test.mjs > /tmp/stockinsider-vnext-ci/analysis.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/analysis.tap.private.log /tmp/stockinsider-vnext-ci/analysis.tap
          test "$test_status" = 0
      - name: Actual all-active thesis, revoked source rights and charged retry (synthetic provider)
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-03
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-03
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/thesis
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              if s.f_bavail*s.f_frsize<8589934592: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_worker -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_WORKER_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -U postgres -d vnext_worker; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-thesis-postgres.test.mjs > /tmp/stockinsider-vnext-ci/thesis.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/thesis.tap.private.log /tmp/stockinsider-vnext-ci/thesis.tap
          test "$test_status" = 0
      - name: Actual current-receipt admission, official calendar and strict EPS (synthetic provider)
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-04
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-04
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/cached
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              if s.f_bavail*s.f_frsize<8589934592: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_worker -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_WORKER_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -U postgres -d vnext_worker; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-cached-postgres.test.mjs > /tmp/stockinsider-vnext-ci/cached.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/cached.tap.private.log /tmp/stockinsider-vnext-ci/cached.tap
          if [ "$test_status" != 0 ]; then
            python3 - <<'PYCODE'
          import hashlib,json,pathlib,re
          source=pathlib.Path('/tmp/stockinsider-vnext-ci/cached.tap.private.log')
          if source.stat().st_size>8*1024*1024: raise SystemExit('bounded diagnostic required')
          text=source.read_text()
          item={'failedTestHashes':[hashlib.sha256(x.encode()).hexdigest() for x in re.findall(r'^\s*not ok \d+ - (.+)$',text,re.M)][:16],
                'codes':list(dict.fromkeys(re.findall(r"^\s*code: ['\"]([A-Z0-9_]{1,40})['\"]",text,re.M)))[:16],
                'errorLineHashes':[hashlib.sha256(x.encode()).hexdigest() for x in re.findall(r'^\s*error: (.+)$',text,re.M)][:16]}
          print('::error title=vNext finite cached-prefix diagnostic::'+json.dumps(item,separators=(',',':')))
          PYCODE
          fi
          test "$test_status" = 0
          export VNEXT_HTTP_DATABASE=vnext_worker
          export VNEXT_LEGACY_SOCKET_PARENT="$VNEXT_WORKER_SOCKET_PARENT"
          export VNEXT_NATIVE_ARTIFACTS=/tmp/stockinsider-vnext-ci/cached-http
          if node --experimental-strip-types scripts/vnext-cached-http.test.mjs > /tmp/stockinsider-vnext-ci/cached-http.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/cached-http.tap.private.log /tmp/stockinsider-vnext-ci/cached-http.tap
          if [ "$test_status" != 0 ]; then
            python3 - <<'PYCODE'
          import json,pathlib
          source=pathlib.Path('/tmp/stockinsider-vnext-ci/cached-http.tap.private.log')
          if source.stat().st_size>8*1024*1024: raise SystemExit('bounded diagnostic required')
          for line in source.read_text().splitlines():
              if line.startswith('VNEXT_HTTP_FAILURE_SAFE '):
                  item=json.loads(line.removeprefix('VNEXT_HTTP_FAILURE_SAFE '))
                  if set(item)!={'stage','code','actual','expected','tokens'}: raise SystemExit('closed diagnostic required')
                  print('::error title=vNext finite HTTP diagnostic::'+json.dumps(item,separators=(',',':')).replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYCODE
          fi
          test "$test_status" = 0
      - name: Actual snapshot receipt install and immutable reads (synthetic Fetch Response)
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-05
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-05
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/twse-snapshot
          VNEXT_TWSE_TEST_STAGE: fresh
