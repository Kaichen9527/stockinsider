          for name in ['roster-current.tap.private.log','roster-current-pg-stop.private.log','roster-current-pg-stop.private.json','roster-current-pg-server.private.log','roster-current-cleanup.private.json']:
              path=root/name
              if path.exists(): paths.append(path)
          if len(paths)>256: raise SystemExit('finite raw inventory bound exceeded')
          rows=[];total=0
          for path in sorted(paths):
