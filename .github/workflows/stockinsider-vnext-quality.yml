          PYCODE
          test "$test_status" = 0
      - name: Hash finite owned raw evidence without publishing private contents
        if: always()
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,re,stat
          root=pathlib.Path('/tmp/stockinsider-vnext-ci')
          paths=[]
          for child in ['trading-invalidity','trading-invalidity-resource']:
              directory=root/child
              if directory.exists():
