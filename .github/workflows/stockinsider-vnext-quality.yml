          python3 - <<'PYCODE'
          import hashlib,json,os,pathlib,re,stat
          root=pathlib.Path('/tmp/stockinsider-vnext-ci')
          paths=[]
          for child in ['roster-current','roster-current-resource']:
              directory=root/child
              if directory.exists():
                  if directory.is_symlink() or not directory.is_dir(): raise SystemExit('owned raw directory required')
