name: StockInsider vNext isolated quality
on:
  pull_request:
    paths:
      - '.github/workflows/stockinsider-vnext-quality.yml'
      - 'web/**'
      - 'scripts/vnext-*'
      - 'scripts/opportunity-v3/**'
      - 'scripts/assert_canonical_vercel_project.mjs'
      - 'deployment/vps/bootstrap-stockinsider-postgres.sql'
      - '.nvmrc'
      - 'scripts/candidate-financial-document-write-lease-route.test.mjs'
      - 'migrations/20261022_*'
      - 'migrations/20261023_*'
      - 'openspec/changes/stockinsider-vnext-20/**'
      - 'specs/research-admission/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  vnext-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Workspace and temporary filesystem admission
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              free=s.f_bavail*s.f_frsize
              print(p,free)
              if free<8589934592: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
      - name: Install unchanged locked dependencies
        run: |
          npm ci --ignore-scripts
          npm --prefix web ci --ignore-scripts
          node web/scripts/sync-official-authority.mjs
      - name: Actual source contracts, types and lint
        run: |
          mkdir -m 700 /tmp/stockinsider-vnext-ci
          node --experimental-strip-types web/src/lib/vnext/vnext.test.ts | tee /tmp/stockinsider-vnext-ci/pure.tap
          node --experimental-strip-types web/src/lib/vnext/discovery.test.ts | tee /tmp/stockinsider-vnext-ci/discovery.tap
          node --experimental-strip-types web/src/lib/vnext/screening-instrument-identity.test.ts | tee /tmp/stockinsider-vnext-ci/screening-instrument-source.tap
          node --experimental-strip-types web/src/lib/vnext/boundaries.test.ts | tee /tmp/stockinsider-vnext-ci/boundaries.tap
          node --experimental-strip-types web/src/lib/vnext/worker.test.ts | tee /tmp/stockinsider-vnext-ci/worker-source.tap
          node --experimental-strip-types web/src/lib/vnext/analysis-sources.test.ts | tee /tmp/stockinsider-vnext-ci/analysis-source.tap
          node --experimental-strip-types web/src/lib/vnext/source-backlog.test.ts | tee /tmp/stockinsider-vnext-ci/source-backlog.tap
          node --experimental-strip-types scripts/vnext-source-window-source.test.mjs | tee /tmp/stockinsider-vnext-ci/source-window-source.tap
          node scripts/vnext-source-namespace-source.test.mjs | tee /tmp/stockinsider-vnext-ci/source-namespace-source.tap
          python3 -B scripts/vnext-reachability-annotation-source.test.py
          node --experimental-strip-types web/src/lib/vnext/twse-snapshot.test.ts | tee /tmp/stockinsider-vnext-ci/twse-snapshot-source.tap
          node --experimental-strip-types web/src/lib/vnext/thesis.test.ts | tee /tmp/stockinsider-vnext-ci/thesis-source.tap
          node --experimental-strip-types web/src/lib/vnext/thesis-semantic-authority.test.ts | tee /tmp/stockinsider-vnext-ci/thesis-semantic-authority-source.tap
          node --experimental-strip-types web/src/lib/vnext/semantic-score-fence.test.ts | tee /tmp/stockinsider-vnext-ci/semantic-score-fence-source.tap
          node --experimental-strip-types web/src/lib/vnext/catalyst-criteria.test.ts | tee /tmp/stockinsider-vnext-ci/catalyst-criteria-source.tap
          node --experimental-strip-types web/src/lib/vnext/forecast-evidence.test.ts | tee /tmp/stockinsider-vnext-ci/forecast-evidence-source.tap
          node --experimental-strip-types web/src/lib/vnext/corporate-action-terms.test.ts | tee /tmp/stockinsider-vnext-ci/action-terms-source.tap
          node scripts/vnext-action-terms-source.test.mjs | tee /tmp/stockinsider-vnext-ci/action-terms-sql-source.tap
          node --experimental-strip-types web/src/lib/vnext/published-target-read.test.ts | tee /tmp/stockinsider-vnext-ci/published-target-read-source.tap
          node scripts/vnext-published-target-read-source.test.mjs | tee /tmp/stockinsider-vnext-ci/published-target-sql-source.tap
          node --experimental-strip-types web/src/lib/vnext/disclosed-fiscal-forecast.test.ts | tee /tmp/stockinsider-vnext-ci/disclosed-fiscal-source.tap
          node scripts/vnext-disclosed-fiscal-source.test.mjs | tee /tmp/stockinsider-vnext-ci/disclosed-fiscal-sql-source.tap
          node --experimental-strip-types web/src/lib/vnext/forecast-current.test.ts | tee /tmp/stockinsider-vnext-ci/forecast-current-source.tap
          node --experimental-strip-types web/src/lib/vnext/forecast-active.test.ts | tee /tmp/stockinsider-vnext-ci/forecast-active-source.tap
          node scripts/vnext-forecast-active-source.test.mjs | tee /tmp/stockinsider-vnext-ci/forecast-active-sql-source.tap
          node --experimental-strip-types scripts/vnext-weekly-forecast-source.test.mjs | tee /tmp/stockinsider-vnext-ci/forecast-weekly-source.tap
          node scripts/vnext-forecast-sources.test.mjs | tee /tmp/stockinsider-vnext-ci/forecast-sql-source.tap
          python3 scripts/vnext-forecast-receipt-source-check.py
          node --experimental-strip-types web/src/lib/vnext/dimensionless-arithmetic.test.ts | tee /tmp/stockinsider-vnext-ci/dimensionless-source.tap
          node --experimental-strip-types web/src/lib/vnext/reviewed-target.test.ts | tee /tmp/stockinsider-vnext-ci/reviewed-target-source.tap
          node --experimental-strip-types web/src/lib/vnext/trading-invalidity.test.ts | tee /tmp/stockinsider-vnext-ci/trading-invalidity-source.tap
          node --experimental-strip-types web/src/lib/vnext/trading-invalidity-discovery.test.ts | tee /tmp/stockinsider-vnext-ci/trading-invalidity-discovery-source.tap
          node --experimental-strip-types web/src/lib/vnext/cached-admission.test.ts | tee /tmp/stockinsider-vnext-ci/cached-source.tap
          node --experimental-strip-types web/src/lib/vnext/source-withdrawal.test.ts | tee /tmp/stockinsider-vnext-ci/withdrawal-source.tap
          node --experimental-strip-types web/src/lib/vnext/artifact-financial-summary.test.ts | tee /tmp/stockinsider-vnext-ci/financial-summary-source.tap
          node --experimental-strip-types web/src/lib/vnext/preparation-authority.test.ts | tee /tmp/stockinsider-vnext-ci/preparation-authority-source.tap
          node --experimental-strip-types web/src/lib/vnext/preparation-reconciliation.test.ts | tee /tmp/stockinsider-vnext-ci/preparation-reconciliation-source.tap
          node --experimental-strip-types web/src/lib/vnext/preparation-trading-identity.test.ts | tee /tmp/stockinsider-vnext-ci/preparation-trading-identity-source.tap
          node --experimental-strip-types web/src/lib/vnext/roster-current-fence.test.ts | tee /tmp/stockinsider-vnext-ci/roster-current-fence-source.tap
          node --experimental-strip-types web/src/lib/vnext/catalyst-cancellation.test.ts | tee /tmp/stockinsider-vnext-ci/cancellation-source.tap
          node --experimental-strip-types web/src/lib/vnext/cancellation-candidate.test.ts | tee /tmp/stockinsider-vnext-ci/cancellation-candidate-source.tap
          node --experimental-strip-types web/src/lib/vnext/business-criteria.test.ts | tee /tmp/stockinsider-vnext-ci/business-criteria-source.tap
          node scripts/vnext-target-profiles.test.mjs | tee /tmp/stockinsider-vnext-ci/target-profiles-source.tap
          node --experimental-strip-types web/src/lib/vnext/business-public.test.ts | tee /tmp/stockinsider-vnext-ci/business-public-source.tap
          node scripts/vnext-cancellation-response-loss.test.mjs | tee /tmp/stockinsider-vnext-ci/cancellation-response-frames-source.tap
          node --experimental-strip-types web/src/lib/vnext/research-failure.test.ts | tee /tmp/stockinsider-vnext-ci/research-failure-source.tap
          node --experimental-strip-types scripts/vnext-business-vectors.test.mjs | tee /tmp/stockinsider-vnext-ci/business-vectors.tap
          node scripts/candidate-financial-document-write-lease-route.test.mjs | tee /tmp/stockinsider-vnext-ci/lease-routes.tap
          npm --prefix web run typecheck
          npm --prefix web run lint
      - name: Full ordinary build
        id: current_build
        run: npm --prefix web run build
      - name: Isolated PostgreSQL real concurrency and synthetic publication lifecycle
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-ci
        run: |
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -d vnext; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if VNEXT_NATIVE_ARTIFACTS=/tmp/stockinsider-vnext-ci/admission node --experimental-strip-types scripts/vnext-admission-postgres.test.mjs > /tmp/stockinsider-vnext-ci/admission.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/admission.tap.private.log /tmp/stockinsider-vnext-ci/admission.tap
          test "$test_status" = 0
          if VNEXT_BUSINESS_DATABASE=vnext_business_01 VNEXT_NATIVE_ARTIFACTS=/tmp/stockinsider-vnext-ci/business node --experimental-strip-types scripts/vnext-business-postgres.test.mjs > /tmp/stockinsider-vnext-ci/business.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/business.tap.private.log /tmp/stockinsider-vnext-ci/business.tap
          test "$test_status" = 0
      - name: Genuine captured-prefix legacy coexistence and concurrent mode fence
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-legacy-full-04
          VNEXT_LEGACY_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/legacy-full-pg-socket-04
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/legacy
        run: |
          mkdir -m 700 /tmp/stockinsider-vnext-oct22-private
          mkdir -m 700 "$VNEXT_LEGACY_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_LEGACY_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_legacy -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_LEGACY_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -d vnext_legacy; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-legacy-fence-postgres.test.mjs > /tmp/stockinsider-vnext-ci/legacy.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/legacy.tap.private.log /tmp/stockinsider-vnext-ci/legacy.tap
          test "$test_status" = 0
      - name: Actual durable worker journal with explicitly synthetic provider
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-01
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-01
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/worker
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              if s.f_bavail*s.f_frsize<8589934592: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_worker -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_WORKER_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -d vnext_worker; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-worker-postgres.test.mjs > /tmp/stockinsider-vnext-ci/worker.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/worker.tap.private.log /tmp/stockinsider-vnext-ci/worker.tap
          test "$test_status" = 0
      - name: Real permitted-source budgets and frozen market journal (synthetic originals/model)
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-02
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-02
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/analysis
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              if s.f_bavail*s.f_frsize<8589934592: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_worker -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_WORKER_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -d vnext_worker; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-analysis-postgres.test.mjs > /tmp/stockinsider-vnext-ci/analysis.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/analysis.tap.private.log /tmp/stockinsider-vnext-ci/analysis.tap
          if [ "$test_status" != 0 ]; then
            python3 - <<'PYCODE'
          import json,pathlib
          source=pathlib.Path('/tmp/stockinsider-vnext-ci/analysis.tap.private.log')
          if source.stat().st_size>8*1024*1024: raise SystemExit('bounded diagnostic required')
          for line in source.read_text().splitlines():
              prefix='ANALYSIS_FAILURE_SAFE '
              if line.startswith(prefix):
                  item=json.loads(line[len(prefix):])
                  if set(item)!={'stage','code','message','errorType'}: raise SystemExit('closed diagnostic required')
                  value=json.dumps(item,ensure_ascii=True,separators=(',',':')).replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::error title=Analysis finite native diagnostic::'+value)
          PYCODE
          fi
          test "$test_status" = 0
      - name: Actual all-active thesis, revoked source rights and charged retry (synthetic provider)
        id: current_thesis
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-03
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-03
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/thesis
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              if s.f_bavail*s.f_frsize<8589934592: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_worker -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_WORKER_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -d vnext_worker; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-thesis-postgres.test.mjs > /tmp/stockinsider-vnext-ci/thesis.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/thesis.tap.private.log /tmp/stockinsider-vnext-ci/thesis.tap
          test "$test_status" = 0
      - name: Actual current-receipt admission, official calendar and strict EPS (synthetic provider)
        id: current_cached
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-04
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-04
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/cached
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              if s.f_bavail*s.f_frsize<8589934592: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_worker -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_WORKER_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          trap 'docker stop "$VNEXT_TEST_CONTAINER"' EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -d vnext_worker; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          if node --experimental-strip-types scripts/vnext-cached-postgres.test.mjs > /tmp/stockinsider-vnext-ci/cached.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/cached.tap.private.log /tmp/stockinsider-vnext-ci/cached.tap
          if [ "$test_status" != 0 ]; then
            python3 - <<'PYCODE'
          import hashlib,json,pathlib,re
          source=pathlib.Path('/tmp/stockinsider-vnext-ci/cached.tap.private.log')
          if source.stat().st_size>8*1024*1024: raise SystemExit('bounded diagnostic required')
          text=source.read_text()
          item={'failedTestHashes':[hashlib.sha256(x.encode()).hexdigest() for x in re.findall(r'^\s*not ok \d+ - (.+)$',text,re.M)][:16],
                'codes':list(dict.fromkeys(re.findall(r"^\s*code: ['\"]([A-Z0-9_]{1,40})['\"]",text,re.M)))[:16],
                'errorLineHashes':[hashlib.sha256(x.encode()).hexdigest() for x in re.findall(r'^\s*error: (.+)$',text,re.M)][:16]}
          print('::error title=vNext finite cached-prefix diagnostic::'+json.dumps(item,separators=(',',':')))
          PYCODE
          fi
          test "$test_status" = 0
          export VNEXT_HTTP_DATABASE=vnext_worker
          export VNEXT_LEGACY_SOCKET_PARENT="$VNEXT_WORKER_SOCKET_PARENT"
          export VNEXT_NATIVE_ARTIFACTS=/tmp/stockinsider-vnext-ci/cached-http
          if node --experimental-strip-types scripts/vnext-cached-http.test.mjs > /tmp/stockinsider-vnext-ci/cached-http.tap.private.log 2>&1; then test_status=0; else test_status=$?; fi
          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/cached-http.tap.private.log /tmp/stockinsider-vnext-ci/cached-http.tap
          if [ "$test_status" != 0 ]; then
            python3 - <<'PYCODE'
          import json,pathlib
          source=pathlib.Path('/tmp/stockinsider-vnext-ci/cached-http.tap.private.log')
          if source.stat().st_size>8*1024*1024: raise SystemExit('bounded diagnostic required')
          for line in source.read_text().splitlines():
              if line.startswith('VNEXT_HTTP_FAILURE_SAFE '):
                  item=json.loads(line.removeprefix('VNEXT_HTTP_FAILURE_SAFE '))
                  if set(item)!={'stage','code','actual','expected','tokens'}: raise SystemExit('closed diagnostic required')
                  print('::error title=vNext finite HTTP diagnostic::'+json.dumps(item,separators=(',',':')).replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PYCODE
          fi
          test "$test_status" = 0
      - name: Actual running preparation HTTP READ and explicit committed-response recovery (synthetic issuer parser)
        if: ${{ !cancelled() && steps.current_build.outcome == 'success' }}
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-08
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-08
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/preparation-running-http
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              if s.f_bavail*s.f_frsize<8589934592+536870912: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
          export VNEXT_PREPARATION_BUILD_SOURCE_SHA="$(git rev-parse HEAD)"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT/socket"
