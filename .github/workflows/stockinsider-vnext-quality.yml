              value=json.loads(loss.read_text())
              keys=['bytes','sha256','oneDataRow','selectOne','noError','ready','forwardedResponseBytes','commitObservedBeforeSocketClose','actualQueryRejected','bothOwnedSocketsClosed','pendingQuery','automaticResend']
              finite_loss={k:value[k] for k in keys}
