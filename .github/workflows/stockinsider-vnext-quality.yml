  cancellation-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Fixed native dependency and workset admission
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),'/tmp']:
              v=os.statvfs(p)
              if v.f_bavail*v.f_frsize<8589934592+536870912: raise SystemExit('NOT_READY: original floor plus workset reference')
          PYCODE
          npm ci --ignore-scripts
          mkdir -m 700 /tmp/stockinsider-vnext-ci
          mkdir -m 700 /tmp/stockinsider-vnext-oct22-private
      - name: Fresh source-bound cancellation via distinct reviewer and atomic publication/exit (synthetic metadata)
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-12
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-12
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/catalyst-cancellation
        run: |
          python3 - <<'PYCODE'
          import os
          for p in [os.getcwd(),"/tmp"]:
              s=os.statvfs(p)
              if s.f_bavail*s.f_frsize<8589934592+536870912: raise SystemExit("NOT_READY: original 8GiB floor")
          PYCODE
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT"
          mkdir -m 700 "$VNEXT_WORKER_SOCKET_PARENT/socket"
          docker run -d --name "$VNEXT_TEST_CONTAINER" --label codex.task=stockinsider-vnext-oct22 --network none --memory=1g --cpus=1 -e POSTGRES_HOST_AUTH_METHOD=trust -e POSTGRES_DB=vnext_worker -e 'POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8' --mount "type=bind,src=$VNEXT_WORKER_SOCKET_PARENT/socket,dst=/var/run/postgresql" postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
          owned_id="$(docker inspect --format '{{.Id}}' "$VNEXT_TEST_CONTAINER")"
          cleanup_trading_invalidity() {
            original_exit=$?
            trap - EXIT
            if ! docker stop "$owned_id" > /tmp/stockinsider-vnext-ci/catalyst-cancellation-pg-stop.private.log 2>&1; then original_exit=1; fi
            if ! docker inspect --format '{{json .State}}' "$owned_id" > /tmp/stockinsider-vnext-ci/catalyst-cancellation-pg-stop.private.json; then original_exit=1; fi
            if ! docker logs --tail 500 "$owned_id" > /tmp/stockinsider-vnext-ci/catalyst-cancellation-pg-server.private.log 2>&1; then original_exit=1; fi
            if ! python3 - <<'PYCODE'
          import hashlib,json,pathlib,os
          state=json.loads(pathlib.Path('/tmp/stockinsider-vnext-ci/catalyst-cancellation-pg-stop.private.json').read_text())
          if state['Running'] or state['Pid']!=0 or state['ExitCode']!=0: raise SystemExit('owned PG shutdown unconfirmed')
          logs=pathlib.Path('/tmp/stockinsider-vnext-ci/catalyst-cancellation-pg-server.private.log').read_bytes()
          if logs.rfind(b'database system is shut down')<=logs.rfind(b'database system is ready to accept connections'): raise SystemExit('PG server shutdown log unconfirmed')
          resource=pathlib.Path('/tmp/stockinsider-vnext-ci/catalyst-cancellation-resource/receipt.json')
          observations=[];unsettled=False
          if resource.exists():
              for owned in json.loads(resource.read_text())['processPostObservation']:
                  pid=owned['pid']
                  try:
                      fields=pathlib.Path(f'/proc/{pid}/stat').read_text().rsplit(')',1)[1].split()
                      same=fields[19]==owned['originalStart'];rss=int(fields[21])*os.sysconf('SC_PAGE_SIZE')
                      observations.append({'pid':pid,'sameProcess':same,'state':fields[0],'rssBytes':rss,'originalIdentitySettled':not same or fields[0]=='Z' and rss==0})
                      unsettled|=same and not(fields[0]=='Z' and rss==0)
                  except FileNotFoundError: observations.append({'pid':pid,'absent':True})
                  except OSError: observations.append({'pid':pid,'unknown':True});unsettled=True
          pathlib.Path('/tmp/stockinsider-vnext-ci/catalyst-cancellation-cleanup.private.json').write_text(json.dumps({'containerState':state,'serverLogSha256':hashlib.sha256(logs).hexdigest(),'shutdownObserved':True,'ownedProcessObservations':observations,'zombieIsNotAbsent':True,'unsettled':unsettled})+'\n')
          if unsettled: raise SystemExit('owned process settlement unknown')
          socket_absence={}
          for name in ['.s.PGSQL.5432','.s.PGSQL.5432.lock']:
              path=pathlib.Path(os.environ['VNEXT_WORKER_SOCKET_PARENT'])/'socket'/name
              try: path.lstat();socket_absence[name]=False
              except FileNotFoundError: socket_absence[name]=True
          if not all(socket_absence.values()): raise SystemExit('owned PG socket absence unconfirmed')
          counts={'absent':sum(v.get('absent',False) for v in observations),'zeroRssZombie':sum(v.get('sameProcess',False) and v.get('state')=='Z' and v.get('rssBytes')==0 for v in observations),'pidReused':sum(v.get('sameProcess') is False for v in observations),'unsettled':sum(v.get('unknown',False) or v.get('sameProcess',False) and not(v.get('state')=='Z' and v.get('rssBytes')==0) for v in observations)}
          print('::notice title=Cancellation cleanup receipt::'+json.dumps({'pgRunning':state['Running'],'pgPid':state['Pid'],'pgExit':state['ExitCode'],'shutdownLogObserved':True,'socketAbsence':socket_absence,'resourceReceiptObserved':resource.exists(),'ownedProcessCounts':counts,'fullPrivateCleanupSha256':hashlib.sha256(pathlib.Path('/tmp/stockinsider-vnext-ci/catalyst-cancellation-cleanup.private.json').read_bytes()).hexdigest(),'dataRetained':True},separators=(',',':')))
          for p in [os.getcwd(),'/tmp']:
              v=os.statvfs(p)
              if v.f_bavail*v.f_frsize<8589934592: raise SystemExit('original floor not held after owned PG stop')
          PYCODE
            then original_exit=1; fi
            exit "$original_exit"
          }
          trap cleanup_trading_invalidity EXIT
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$VNEXT_TEST_CONTAINER" pg_isready -h 127.0.0.1 -U postgres -d vnext_worker; then ready=1; break; fi
            sleep 1
          done
