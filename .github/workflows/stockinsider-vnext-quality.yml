          python3 scripts/vnext-safe-tap.py /tmp/stockinsider-vnext-ci/twse-snapshot.tap.private.log /tmp/stockinsider-vnext-ci/twse-snapshot.tap
          test "$test_status" = 0
      - name: Source-bound catalyst protocol and current score (synthetic sources/provider)
        env:
          VNEXT_TEST_CONTAINER: stockinsider-vnext-oct22-worker-06
          VNEXT_WORKER_SOCKET_PARENT: /tmp/stockinsider-vnext-oct22-private/worker-pg-socket-06
          VNEXT_NATIVE_ARTIFACTS: /tmp/stockinsider-vnext-ci/catalyst
          VNEXT_CATALYST_TEST_STAGE: fresh
        run: |
