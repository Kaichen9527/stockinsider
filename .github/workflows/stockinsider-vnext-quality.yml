          import hashlib,json,pathlib,re,subprocess
          root=pathlib.Path('/tmp/stockinsider-vnext-ci')
          raw=root/'trading-invalidity.tap.private.log'
          if raw.stat().st_size>8*1024*1024: raise SystemExit('bounded native diagnostic required')
