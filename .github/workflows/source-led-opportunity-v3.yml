name: Source-led opportunity V3

on:
  pull_request:
    paths:
      - '.github/workflows/source-led-opportunity-v3.yml'
      - '.github/protected-model-oracle-reuse-v1.json'
      - '.loop-engineering/state/changes/source-led-opportunity-engine-v3/**'
      - 'migrations/20260724_source_led_opportunity_engine_v3.sql'
      - 'migrations/20260907*.sql'
      - 'migrations/20260909*.sql'
      - 'migrations/20260911*.sql'
      - 'deployment/vps/**'
      - 'scripts/model-runner-v3/**'
      - 'scripts/opportunity-v3/**'
      - 'scripts/runtime/**'
      - 'scripts/local-auth-source-worker.sh'
      - 'scripts/runtime_doctor.js'
      - 'scripts/run-node22.js'
      - 'scripts/research-historical-cash-core.test.mjs'
      - 'scripts/fixtures/research-historical-cash/**'
      - '.github/workflows/research-historical-cash-quality.yml'
      - 'web/src/app/api/internal/financial-fact-v3/**'
      - 'web/src/app/api/internal/candidate-*/**'
      - 'web/src/app/api/internal/finmind-*/**'
      - 'web/src/app/api/internal/instrument-roster-v3/**'
      - 'web/src/app/api/internal/market-observation-v3/**'
      - 'web/src/app/api/internal/opportunity-*/**'
      - 'web/src/app/api/internal/peer-*-v3/**'
      - 'web/src/app/api/internal/price-authority-v3/**'
      - 'web/src/app/api/internal/publisher-verification-authority-v3/**'
      - 'web/src/app/api/internal/source-*-v3/**'
      - 'web/src/app/api/internal/stock-*-v3/**'
      - 'web/src/app/api/internal/trading-session-v3/**'
      - 'web/src/app/api/internal/valuation-verification-v3/**'
      - 'web/src/app/api/opportunity-v3/**'
      - 'web/src/app/api/radar/**'
      - 'web/src/app/api/stocks/**'
      - 'web/src/app/opportunity-v3/**'
      - 'web/src/app/stock/**'
      - 'web/src/app/sources/**'
      - 'web/src/app/page.tsx'
      - 'web/src/app/components/RadarTabs.tsx'
      - 'web/src/lib/types.ts'
      - 'web/src/lib/research-historical-cash-core.ts'
      - 'web/src/lib/candidate-*.ts'
      - 'web/src/lib/discovery-*.ts'
      - 'web/src/lib/live-discovery-*.ts'
      - 'web/src/lib/finmind-*.ts'
      - 'web/src/lib/shadow-*.ts'
      - 'web/src/app/components/ShadowOpportunityV3.tsx'
      - 'web/src/lib/opportunity-v3/**'
      - 'package.json'
      - 'package-lock.json'
      - 'web/package.json'
      - 'web/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"
      STOCKINSIDER_DOCUMENT_PARSER_PYTHON: ${{ github.workspace }}/.parser-env/bin/python
      STOCKINSIDER_DOCUMENT_PARSER_SCRIPT: ${{ github.workspace }}/scripts/candidate_financial_document_parser.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          postgres_bin="$(pg_config --bindir)"
          test -x "$postgres_bin/initdb"
          test -x "$postgres_bin/pg_ctl"
          echo "$postgres_bin" >> "$GITHUB_PATH"
      - name: Install root dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated offline parser test dependencies
        run: |
          python -m venv .parser-env
          .parser-env/bin/pip install -r scripts/requirements-candidate-financial-document-parser.txt
          .parser-env/bin/python scripts/test_candidate_financial_parser_socket.py
          .parser-env/bin/python scripts/test_candidate_financial_document_parser.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Verify candidate revision and historical date contracts
        run: npm run test:candidate-revision-history
      - name: Install project-local Playwright Chromium
        working-directory: web
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run diagnostic product/runtime suite (not authoritative Code Gate evidence)
        run: |
          # Preserve the exact diagnostic command/exit; emit only bounded safe
          # failure metadata because raw job-log downloads may be unavailable.
          diagnostic_log="$(mktemp /tmp/stockinsider-product-runtime.XXXXXX)"
          set +e
          npm run diagnostic:source-led-opportunity-v3:product-runtime 2>&1 | tee "$diagnostic_log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          if [ "${statuses[0]}" != 0 ]; then
            python3 - "$diagnostic_log" <<'PYCODE'
          import pathlib,json,re,sys,hashlib
          path=pathlib.Path(sys.argv[1])
          if not path.is_file() or path.is_symlink() or path.stat().st_size>16*1024*1024:
              print('::error title=Product diagnostic stage::bounded log unavailable')
              raise SystemExit(0)
          scripts=json.loads(pathlib.Path('package.json').read_text())['scripts']
          last=None;failed=[];codes=set()
          for line in path.read_text(errors='replace').splitlines():
              match=re.fullmatch(r'> (?:[^\s]{1,120} )?([a-zA-Z0-9:_-]{1,120})',line)
              if match and match[1] in scripts:last=match[1]
              match=re.match(r'\s*not ok [0-9]+ - (.+)',line)
              if match and len(failed)<30:failed.append(hashlib.sha256(match[1].encode()).hexdigest())
              match=re.fullmatch(r"\s*code: '?([A-Z0-9_]{4,40})'?",line)
              if match:codes.add(match[1])
          safe={'lastNpmScript':last,'failedTestNameSha256':failed,'codes':sorted(codes)[:30],'scope':'diagnostic metadata only; original failure preserved'}
          print('::error title=Product diagnostic stage::'+json.dumps(safe,separators=(',',':')))
          PYCODE
          fi
          test "${statuses[1]}" = 0
          exit "${statuses[0]}"

  evaluation-governance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install exact Web dependencies for evaluation imports
        run: npm --prefix web ci --ignore-scripts
      - name: Run evaluation/governance diagnostic (promotion evidence only)
        run: node scripts/run-node22.js --experimental-strip-types --test --test-name-pattern="evaluation and product-value readiness|hybrid verified-change product boundary" web/src/lib/opportunity-v3/opportunity-v3.test.ts && node scripts/run-node22.js --experimental-strip-types scripts/opportunity-v3/evaluation-governance-gate.mjs --require-backtest-dates 120 --require-live-dates 20 --require-attempt-roster 252

  model-runner:
    if: github.event_name == 'workflow_dispatch' && vars.OPPORTUNITY_V3_RUNNER_TRACK == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Verify pinned macOS model-runner track
        run: npm run verify:source-led-opportunity-v3:model-runner

  pr-product-runtime-gate:
    name: stockinsider-v3-diagnostic-product-runtime
    if: always()
    needs: [product-runtime]
    runs-on: ubuntu-24.04
    steps:
      - name: Require executable PR product/runtime evidence only
        env:
          PRODUCT_RUNTIME_RESULT: ${{ needs.product-runtime.result }}
        run: |
          test "$PRODUCT_RUNTIME_RESULT" = success
