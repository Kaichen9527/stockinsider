name: Research publication tail quality diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/research-publication-tail-quality.yml'
      - 'scripts/opportunity-v3/**'
      - 'migrations/**'
      - 'deployment/vps/bootstrap-stockinsider-postgres.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'web/package.json'
      - 'web/package-lock.json'
permissions:
  contents: read
jobs:
  research-publication-tail-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Install PostgreSQL 17 using the existing official signing identity
        shell: bash
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/pgdg.asc"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$key"
          fingerprint=$(gpg --batch --show-keys --with-colons "$key" | awk -F: '$1=="fpr" {print $10; exit}')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          sudo install -m 0644 "$key" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'Types: deb' 'URIs: https://apt.postgresql.org/pub/repos/apt' 'Suites: noble-pgdg' 'Architectures: amd64' 'Components: main' 'Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc' | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17 postgresql-client-17
          bin=/usr/lib/postgresql/17/bin
          for tool in pg_config initdb pg_ctl psql; do test -x "$bin/$tool"; done
          "$bin/pg_config" --version | grep -E '^PostgreSQL 17\.'
          echo "$bin" >> "$GITHUB_PATH"
          echo "USER=$(id -un)" >> "$GITHUB_ENV"
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm --prefix web ci --ignore-scripts
      - name: Prepare private fresh evidence paths
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/publication-tail-quality"
          mkdir -m 0700 "$evidence"
          echo "RESEARCH_TAIL_CI_EVIDENCE=$evidence" >> "$GITHUB_ENV"
      - name: Verify finite extraction and entry guards
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 \
            scripts/opportunity-v3/research-publication-tail-extraction.test.mjs \
            scripts/opportunity-v3/research-publication-tail-entry-guard.test.mjs \
            2>&1 | tee "$RESEARCH_TAIL_CI_EVIDENCE/pure.stdout"
      - name: Verify captured-schema guarded tail transaction
        shell: bash
        run: |
          set -euo pipefail
          export RESEARCH_TAIL_ARTIFACTS="$RESEARCH_TAIL_CI_EVIDENCE/entry-native"
          node --test --test-concurrency=1 \
            scripts/opportunity-v3/research-publication-tail-entry-native.test.mjs \
            2>&1 | tee "$RESEARCH_TAIL_CI_EVIDENCE/entry-native.stdout"
      - name: Verify prerequisite fragment causal matrix
        shell: bash
        run: |
          set -euo pipefail
          export RESEARCH_TAIL_ARTIFACTS="$RESEARCH_TAIL_CI_EVIDENCE/fragments-native"
          node --test --test-concurrency=1 \
            scripts/opportunity-v3/research-publication-tail-fragments-native.test.mjs \
            2>&1 | tee "$RESEARCH_TAIL_CI_EVIDENCE/fragments-native.stdout"
      - name: Retain exact local engineering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4; existing repository pin
        with:
          name: publication-tail-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication-tail-quality
          if-no-files-found: warn
          retention-days: 14
