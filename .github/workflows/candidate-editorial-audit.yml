name: Read-only candidate and official editorial audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/candidate-editorial-audit.yml'
      - 'web/src/lib/candidate-audit-export*'
      - 'web/src/app/api/internal/candidate-audit-export/**'
      - 'research/current-editorial/**'

permissions:
  contents: read
  actions: read

jobs:
  bounded-editorial:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/tw-strategy-lab-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test pure candidate read boundaries and factual brief arithmetic
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/candidate-editorial-audit"
          node --experimental-strip-types --test web/src/lib/candidate-audit-export.test.ts 2>&1 | tee "$RUNNER_TEMP/candidate-editorial-audit/candidate-tests.log"
          python -m unittest discover -s research/current-editorial -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/candidate-editorial-audit/editorial-tests.log"
      - name: Admit explicitly bounded current-editorial reads only
        id: scope
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os, pathlib, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          execute = 'research/current-editorial/revenue_briefs.py' in changed and datetime.now(timezone.utc) < datetime(2026, 9, 26, 12, tzinfo=timezone.utc)
          record = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'execute': execute, 'scope': 'two_public_current_revenue_CSVs_for_176_supplied_cards', 'historical_simulations': 0, 'production_mutation': False}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate-editorial-audit/mode.json').write_text(json.dumps(record, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('execute=' + str(execute).lower() + '\n')
          PY
      - name: Retrieve exact previously verified official company identity artifact
        if: steps.scope.outputs.execute == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: official-company-identities-36151224907-1
          run-id: 36151224907
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/editorial-identity-input
      - name: Build factual current revenue briefs without DB access or publication
        if: steps.scope.outputs.execute == 'true'
        run: |
          python research/current-editorial/revenue_briefs.py \
            --cards research/tw-strategy-lab/sources/public-roster-20260925T134939Z.csv \
            --identities "$RUNNER_TEMP/editorial-identity-input/official-company-identities.json" \
            --identity-sha256 5d08690113e11a659f953c43544029b708dd9b1cecdaf82dfef3c3717ae72580 \
            --output "$RUNNER_TEMP/candidate-editorial-audit/revenue-briefs"
      - name: Preserve real official inputs, calculations, source gaps and tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-editorial-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-editorial-audit/
          retention-days: 14
          if-no-files-found: error
