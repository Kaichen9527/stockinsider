name: Archive observed Chat research (not release gate)

on:
  push:
    branches:
      - 'evidence/chat-20260926-c3522ea-results'

permissions:
  contents: read

jobs:
  archive-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify captured bytes and explicit non-release identity
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('research/tw-strategy-lab/results/mac-20260926-c3522ea')
          listing=json.loads((root/'file-sha256.json').read_text())
          for name,digest in listing.items():
              relative=pathlib.Path(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              path=root/relative
              assert path.is_file() and not path.is_symlink()
              assert hashlib.sha256(path.read_bytes()).hexdigest()==digest
          result=json.loads((root/'results.json').read_text())
          invocation=json.loads((root/'invocation.json').read_text())
          assert result['identity']['source']['commit']=='c3522eac9ec9f5712ae094c3864b1da50664e829'
          assert result['completed_simulation_paths']==31 and len(result['trials'])==31
          assert result['R1_canonical_replay_passed'] is True
          assert invocation['original_inputs_unchanged'] is True and invocation['exit_code']==0
          assert result['production_authorized'] is False and result['holdout_accessed'] is False
          assert result['winner_selected'] is None
          print('Captured Mac results verified; this archive job does not simulate or approve a release.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chat-observed-c3522ea-${{ github.run_id }}
          path: research/tw-strategy-lab/results/mac-20260926-c3522ea/
          retention-days: 30
          if-no-files-found: error
