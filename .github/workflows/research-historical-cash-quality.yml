name: Historical cash arithmetic quality diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/research-historical-cash-quality.yml'
      - 'web/src/lib/research-historical-cash-core.ts'
      - 'web/src/lib/research-historical-cash-pins.ts'
      - 'web/src/lib/research-historical-cash-projection.ts'
      - 'web/src/lib/research-scenario-cash-material.ts'
      - 'web/src/lib/research-business-calculator.ts'
      - 'web/src/lib/research-financial-clock.ts'
      - 'scripts/research-scenario-cash-material.test.mjs'
      - 'web/src/lib/research-cash-financial-reader.ts'
      - 'web/src/lib/research-financial-io-owner.ts'
      - 'web/src/lib/research-financial-io-engine.ts'
      - 'scripts/research-cash-single-owner-reader.test.mjs'
      - 'scripts/research-scenario-cash-reader.test.mjs'
      - 'scripts/research-historical-cash-core.test.mjs'
      - 'scripts/research-historical-cash-projection.test.mjs'
      - 'scripts/fixtures/research-historical-cash/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'web/package.json'
      - 'web/package-lock.json'
permissions:
  contents: read
jobs:
  historical-cash-arithmetic-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
      - name: Verify actual runtime and dependency-free arithmetic contracts
        run: |
          test "$(node --version)" = v22.14.0
          node --experimental-strip-types --test --test-concurrency=1 scripts/research-historical-cash-core.test.mjs scripts/research-historical-cash-projection.test.mjs scripts/research-scenario-cash-material.test.mjs scripts/research-cash-single-owner-reader.test.mjs scripts/research-scenario-cash-reader.test.mjs
