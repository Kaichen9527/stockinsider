name: Read-only pinned-host mismatch diagnostic
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pinned-host-readonly-diagnostic.yml'
permissions:
  contents: read
jobs:
  admit-once:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/tw-strategy-lab-v1' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      execute: ${{ steps.admit.outputs.execute }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: admit
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import os, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True).splitlines()
          execute = changed == ['.github/workflows/pinned-host-readonly-diagnostic.yml'] and datetime.now(timezone.utc) < datetime(2026,9,26,12,tzinfo=timezone.utc)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('execute=' + str(execute).lower() + '\n')
          PY
  diagnostic:
    needs: admit-once
    if: needs.admit-once.outputs.execute == 'true'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 169aad1b6cfa747f78ae3464b614f43c0749d806
          persist-credentials: false
          path: protected-pin-diagnostic
      - name: Compare only pinned public executable identity fields
        working-directory: protected-pin-diagnostic
        run: |
          /usr/local/bin/node <<'JS'
          const fs = require('node:fs'); const path = require('node:path'); const crypto = require('node:crypto');
          const { spawnSync } = require('node:child_process');
          const { loadHostPins, hashFile, PIN_FIXTURE_SHA256, PIN_FIXTURE_BYTES } = require('./scripts/model-runner-v3/hostPreflight');
          const file = '.loop-engineering/state/changes/source-led-opportunity-engine-v3/model-runner-host-pins-v3.json';
          const raw = fs.readFileSync(file);
          const out = { schema: 'pinned-host-readonly-diagnostic-v1', observed_at: new Date().toISOString(),
            executor_base: '169aad1b6cfa747f78ae3464b614f43c0749d806', platform: process.platform, architecture: process.arch,
            process_node: { path: process.execPath, version: process.version },
            fixture: { bytes: raw.length, expected_bytes: PIN_FIXTURE_BYTES,
              sha256_pre_lf: crypto.createHash('sha256').update(raw.subarray(0,-1)).digest('hex'), expected_sha256: PIN_FIXTURE_SHA256 },
            executables: [], mismatches: [], policy_modified: false, pins_modified: false,
            credentials_read: false, model_invoked: false, production_written: false, approval_granted: false };
          const command = (exe,args) => {
            const r = spawnSync(exe,args,{encoding:'utf8',timeout:30000,maxBuffer:65536,
              env:{PATH:'/usr/bin:/bin:/usr/sbin:/sbin',LANG:'C',LC_ALL:'C'},shell:false});
            return {exit_code:r.status,signal:r.signal,stdout:r.stdout||'',stderr:r.stderr||''};
          };
          try {
            const pins = loadHostPins(path.resolve(file));
            const rows = [...pins.executables, {name:'bundle',path:pins.codexBundle.path,stat:pins.codexBundle.stat,signing:pins.codexBundle}];
            for (const entry of rows) {
              const row={name:entry.name,path:entry.path,expected:entry.stat};
              try {
                const s=fs.lstatSync(entry.path,{bigint:true});
                row.actual={device:String(s.dev),inode:String(s.ino),size:String(s.size),uid:Number(s.uid),gid:Number(s.gid),mode:(s.mode&0o177777n).toString(8).padStart(6,'0')};
                row.realpath=fs.realpathSync(entry.path);
                for (const key of Object.keys(entry.stat)) if(row.actual[key]!==entry.stat[key]) out.mismatches.push(entry.name+'.stat.'+key);
                if(row.realpath!==entry.path) out.mismatches.push(entry.name+'.realpath');
                if (entry.name!=='bundle') {
                  row.sha256=hashFile(entry.path); row.expected_sha256=entry.sha256;
                  if(row.sha256!==entry.sha256) out.mismatches.push(entry.name+'.sha256');
                  row.version_result=command(entry.path,['--version']); row.expected_version=entry.version;
                  if(row.version_result.stdout.trim()!==entry.version || row.version_result.exit_code!==0) out.mismatches.push(entry.name+'.version');
                }
                if(entry.signing) {
                  row.signature_verification=command('/usr/bin/codesign',['--verify','--deep','--strict',entry.path]);
                  const detail=command('/usr/bin/codesign',['-d','--verbose=4',entry.path]);
                  row.signing_fields=detail.stderr.split('\n').filter(l=>/^(Identifier|TeamIdentifier|CDHash|CDHashFull|CDHashFullSha256|CodeDirectory|Authority)=/.test(l));
                  if(row.signature_verification.exit_code!==0) out.mismatches.push(entry.name+'.signature_verification');
                  if(entry.name==='bundle') row.gatekeeper=command('/usr/sbin/spctl',['-a','-vv',entry.path]);
                }
              } catch(error) {row.error_class=error.constructor.name;out.mismatches.push(entry.name+'.unavailable');}
              out.executables.push(row);
            }
          } catch(error) {out.error_class=error.constructor.name;out.mismatches.push('fixture_not_admitted');}
          out.status=out.mismatches.length?'identity_mismatch_observed':'stat_digest_version_match_signature_details_require_full_preflight';
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'pinned-host-diagnostic.json'),JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({status:out.status,mismatches:out.mismatches,approval_granted:false}));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: pinned-host-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinned-host-diagnostic.json
          retention-days: 14
          if-no-files-found: error
