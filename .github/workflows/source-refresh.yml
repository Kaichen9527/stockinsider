name: Public Source Refresh

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes to DB)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

concurrency:
  group: stockinsider-production-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_URL: ${{ secrets.APP_URL }}
      EXPECTED_APP_URL: https://stockinsider-three.vercel.app
      INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Refresh every server-authorized source
        run: node scripts/call_internal_api.mjs /api/internal/source-sync "{\"connector\":\"all\",\"dryRun\":$DRY_RUN}" | tee /tmp/source-refresh.json
      - name: Upload source terminal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-refresh-${{ github.run_id }}
          path: /tmp/source-refresh.json
          retention-days: 14
